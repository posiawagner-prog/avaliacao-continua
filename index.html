<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avaliação Continua de Aprendizagem - CICLO I E CICLO II</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --bg:#0c0c0d; --card:#18181b; --text:#fff; --muted:#9a9aa3; --border:rgba(255,255,255,.08); --green:#00e676; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "DM Sans", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1a2a22, var(--bg));
      color: var(--text); padding: 24px;
    }
    main {
      width: min(560px, 100%); background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 28px 24px; box-shadow: 0 16px 40px rgba(0,0,0,.35);
    }
    .logos {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px;
    }
    .logos img { height: 52px; width: auto; object-fit: contain; }
    h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: .02em; line-height: 1.35; }
    p { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.45; }
    nav { display: grid; gap: 10px; }
    a {
      display: flex; align-items: center; justify-content: space-between;
      text-decoration: none; color: var(--text); font-weight: 600; font-size: 15px;
      padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border);
      background: #121214; transition: border-color .15s, transform .15s;
    }
    a:hover { border-color: var(--green); transform: translateY(-1px); }
    a span { color: var(--green); font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="logos">
      <img src="assets/logo-prefeitura.png" alt="Prefeitura de São José da Tapera" />
      <img src="assets/logo-semed.png" alt="SEMED - Secretaria Municipal de Educação" />
    </div>
    <h1>Avaliação Continua de Aprendizagem - CICLO I E CICLO II</h1>
    <p>Escolha o ano escolar para abrir o painel de acompanhamento (6º ao 9º ano · Língua Portuguesa e Matemática).</p>
    <nav aria-label="Anos escolares">
      <a href="6o-ano/">6º ano <span>Abrir →</span></a>
      <a href="7o-ano/">7º ano <span>Abrir →</span></a>
      <a href="8o-ano/">8º ano <span>Abrir →</span></a>
      <a href="9o-ano/">9º ano <span>Abrir →</span></a>
    </nav>
  </main>
</body>
</html>
